<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Математический тренажер</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-color: #2c3e50;
            --border-color: #bdc3c7;
            --focus-color: #3498db;
            --success-color: #27ae60;
            --error-color: #e74c3c;
            --btn-bg: #ecf0f1;
            --btn-active: #d5dbdb;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Georgia', serif; /* Классический шрифт для примеров */
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px 10px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
        }

        .app-container {
            width: 100%;
            max-width: 700px;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        h1 {
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 30px;
            color: var(--text-color);
        }

        /* --- Экран настройки --- */
        .setup-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 40px 0;
        }

        .setup-screen p {
            font-family: 'Segoe UI', sans-serif;
            font-size: 18px;
            margin: 0;
        }

        .count-input {
            font-size: 24px;
            width: 100px;
            padding: 10px;
            text-align: center;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-family: 'Georgia', serif;
            outline: none;
        }
        .count-input:focus { border-color: var(--focus-color); }

        .btn {
            font-family: 'Segoe UI', sans-serif;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            background-color: var(--text-color);
            color: white;
        }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { background-color: #ccc; cursor: not-allowed; transform: none; }
        
        .btn-secondary {
            background-color: var(--btn-bg);
            color: var(--text-color);
        }
        .btn-secondary:active { background-color: var(--btn-active); }
        
        .btn-danger { background-color: var(--error-color); }

        /* --- Экран тренажера --- */
        .trainer-screen { display: none; }

        .top-controls {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 10px;
        }

        .status-banner {
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            min-height: 24px;
            margin-bottom: 20px;
        }
        .status-success { color: var(--success-color); }
        .status-error { color: var(--error-color); }

        /* Сетка примеров (идеально ровная) */
        .examples-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 120px; /* Место под нижнюю панель */
        }

        .task-row {
            display: flex;
            align-items: flex-end;
            justify-content: flex-start;
            font-size: 26px;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .math-block {
            display: flex;
            align-items: flex-end;
            flex-wrap: nowrap;
        }

        /* Обертка для знака и поля над ним */
        .symbol-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            margin: 0 4px;
        }

        .intermediate-input {
            width: 40px;
            height: 24px;
            font-size: 16px;
            text-align: center;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-bottom: 6px;
            font-family: 'Segoe UI', sans-serif;
            background-color: #fafafa;
            outline: none;
            padding: 0;
        }
        .intermediate-input:focus { border-color: var(--focus-color); background: #fff; }
        
        /* Пустышка, если нет промежуточного поля (для ровности) */
        .intermediate-spacer {
            height: 24px;
            margin-bottom: 6px;
        }

        .symbol-text {
            font-size: 26px;
            line-height: 1;
            padding-bottom: 4px;
        }

        .number-text {
            font-size: 26px;
            line-height: 1;
            padding-bottom: 4px;
            margin: 0 4px;
        }

        .equals-sign {
            font-size: 26px;
            line-height: 1;
            padding-bottom: 4px;
            margin: 0 10px;
        }

        .final-input {
            width: 60px;
            height: 36px;
            font-size: 22px;
            text-align: center;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            font-family: 'Georgia', serif;
            outline: none;
            margin-bottom: 2px;
        }
        .final-input:focus { border-color: var(--focus-color); }

        /* --- Нижняя панель (Кнопка Проверить и Клавиатура) --- */
        .bottom-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #fff;
            box-shadow: 0 -2px 15px rgba(0,0,0,0.1);
            padding: 10px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        .check-btn {
            width: 100%;
            max-width: 400px;
            font-size: 18px;
            padding: 15px;
        }

        /* Компактная клавиатура */
        .keyboard {
            display: none; /* Скрыта на десктопе */
            width: 100%;
            max-width: 400px;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }

        .keyboard button {
            font-family: 'Segoe UI', sans-serif;
            font-size: 20px;
            font-weight: 600;
            padding: 12px 0;
            background: var(--btn-bg);
            color: var(--text-color);
            border: none;
            border-radius: 6px;
            box-shadow: 0 2px 0 #ccc;
        }
        .keyboard button:active { transform: translateY(2px); box-shadow: none; }
        
        .keyboard .vk-delete { background: #ffeaa7; box-shadow: 0 2px 0 #fdcb6e; }
        .keyboard .vk-clear { background: #ff7675; color: white; box-shadow: 0 2px 0 #d63031; }

        /* --- Стили для ПЕЧАТИ (А4) --- */
        @media print {
            body { background: #fff; padding: 0; display: block; }
            .app-container { box-shadow: none; padding: 0; max-width: 100%; border-radius: 0; }
            h1 { font-size: 20px; margin-bottom: 20px; text-align: left; border-bottom: 2px solid #000; padding-bottom: 5px; }
            .top-controls, .bottom-panel, .status-banner, .setup-screen { display: none !important; }
            .trainer-screen { display: block !important; }
            
            /* Печать в 2 колонки */
            .examples-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 30px 40px;
                margin-bottom: 0;
            }
            
            .task-row {
                border-bottom: none;
                page-break-inside: avoid;
                font-size: 22px; /* Чуть меньше для печати */
                padding: 5px 0;
            }
            
            .intermediate-input, .intermediate-spacer {
                display: none !important; /* Скрываем поля промежуточных вычислений */
            }
            
            .symbol-text, .number-text, .equals-sign {
                font-size: 22px;
                padding-bottom: 0;
                line-height: 1.5;
            }

            .final-input {
                border: none;
                border-bottom: 2px solid #000;
                border-radius: 0;
                width: 60px;
                height: 26px;
                background: transparent;
                color: transparent; /* Скрываем введенный текст */
                font-size: 22px;
            }
        }

        /* Медиа-запрос для планшетов/телефонов */
        @media (max-width: 600px) {
            .app-container { padding: 15px; }
            .task-row { font-size: 22px; }
            .symbol-text, .number-text, .equals-sign { font-size: 22px; }
            .intermediate-input { width: 34px; height: 22px; font-size: 14px; margin-bottom: 4px; }
            .intermediate-spacer { height: 22px; margin-bottom: 4px; }
            .final-input { width: 55px; height: 32px; font-size: 20px; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <h1>Математика. Тренажер.</h1>

        <!-- Экран настройки -->
        <div class="setup-screen" id="setupScreen">
            <p>Количество примеров:</p>
            <input type="number" id="countInput" class="count-input" value="10" min="1" max="50">
            <button class="btn" onclick="startTraining()">Сгенерировать</button>
        </div>

        <!-- Экран тренажера -->
        <div class="trainer-screen" id="trainerScreen">
            <div class="top-controls">
                <button class="btn btn-danger" onclick="resetTraining()">Сбросить</button>
                <button class="btn btn-secondary" onclick="window.print()">Печать (А4)</button>
            </div>

            <div class="status-banner" id="statusBanner"></div>

            <div class="examples-grid" id="examplesGrid">
                <!-- Примеры генерируются тут -->
            </div>
        </div>
    </div>

    <!-- Нижняя панель -->
    <div class="bottom-panel" id="bottomPanel" style="display: none;">
        <button class="btn check-btn" id="checkBtn" onclick="checkAnswers()" disabled>Проверить</button>
        
        <!-- Экранная клавиатура -->
        <div class="keyboard" id="virtualKeyboard">
            <button onclick="vkInput('1')">1</button>
            <button onclick="vkInput('2')">2</button>
            <button onclick="vkInput('3')">3</button>
            <button onclick="vkInput('4')">4</button>
            <button onclick="vkInput('5')">5</button>
            <button onclick="vkInput('6')">6</button>
            <button onclick="vkInput('7')">7</button>
            <button onclick="vkInput('8')">8</button>
            <button onclick="vkInput('9')">9</button>
            <button onclick="vkInput('0')">0</button>
            <button class="vk-delete" onclick="vkDelete()">⌫</button>
            <button class="vk-clear" onclick="vkClear()" style="grid-column: span 4;">Очистить</button>
        </div>
    </div>

    <script>
        let tasks = [];
        let activeInput = null;
        const LS_KEY = 'math_trainer_v2';

        window.onload = function() {
            loadState();
            
            // Показываем клавиатуру только на сенсорных экранах
            if ('ontouchstart' in window) {
                document.getElementById('virtualKeyboard').style.display = 'grid';
            }

            if (tasks.length > 0) {
                showTrainer();
            }
        };

        function randomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        // --- Логика генерации ---
        function generateTask() {
            const types = ['mul', 'div', 'brackets', 'brackets_div', 'trap'];
            const type = types[randomInt(0, types.length - 1)];
            
            let expression = []; 
            let steps = []; 

            if (type === 'mul') {
                let a = randomInt(2, 9), b = randomInt(2, 9);
                expression = [{num: a}, {sym: '×', step: 0}, {num: b}];
                steps.push(a * b);
            } 
            else if (type === 'div') {
                let b = randomInt(2, 9), res = randomInt(2, 9), a = b * res;
                expression = [{num: a}, {sym: ':', step: 0}, {num: b}];
                steps.push(res);
            }
            else if (type === 'brackets') {
                let a = randomInt(10, 50), b = randomInt(1, 9);
                if (a < b) [a, b] = [b, a];
                let isPlus = randomInt(0, 1) === 1;
                let op1 = isPlus ? '+' : '-';
                let res1 = isPlus ? a + b : a - b;
                let c = randomInt(2, 5);
                
                expression = [
                    {sym: '(', step: null},
                    {num: a}, {sym: op1, step: 0}, {num: b}, {sym: ')', step: null},
                    {sym: '×', step: 1}, {num: c}
                ];
                steps.push(res1, res1 * c);
            }
            else if (type === 'brackets_div') {
                let a = randomInt(20, 80), b = randomInt(1, 9);
                if (a < b) [a, b] = [b, a];
                let op1 = '-';
                let res1 = a - b;
                
                let divisors = [];
                for(let i=2; i<=9; i++) if(res1 % i === 0) divisors.push(i);
                let c = divisors.length > 0 ? divisors[randomInt(0, divisors.length-1)] : 2;
                if (divisors.length === 0) res1 = c * randomInt(2,9); // Fallback

                expression = [
                    {sym: '(', step: null},
                    {num: a}, {sym: op1, step: 0}, {num: b}, {sym: ')', step: null},
                    {sym: ':', step: 1}, {num: c}
                ];
                steps.push(res1, res1 / c);
            }
            else if (type === 'trap') {
                let a = randomInt(10, 50), b = randomInt(10, 50);
                let c = randomInt(0, 1) === 1 ? 1 : 0;
                let d = c === 1 ? 0 : 1;
                let op = randomInt(0, 1) === 1 ? '+' : '-';
                
                expression = [
                    {num: a}, {sym: '×', step: 0}, {num: c},
                    {sym: op, step: 2},
                    {num: b}, {sym: '×', step: 1}, {num: d}
                ];
                steps[0] = a * c;
                steps[1] = b * d;
                steps[2] = op === '+' ? steps[0] + steps[1] : steps[0] - steps[1];
            }

            return {
                expression: expression,
                steps: steps,
                finalAnswer: steps[steps.length - 1],
                userSteps: new Array(steps.length).fill(''),
                userFinal: ''
            };
        }

        // --- Управление ---
        function startTraining() {
            const count = parseInt(document.getElementById('countInput').value);
            if (isNaN(count) || count < 1 || count > 50) return alert('Введите число от 1 до 50');

            tasks = [];
            for (let i = 0; i < count; i++) tasks.push(generateTask());
            
            saveState();
            showTrainer();
        }

        function showTrainer() {
            document.getElementById('setupScreen').style.display = 'none';
            document.getElementById('trainerScreen').style.display = 'block';
            document.getElementById('bottomPanel').style.display = 'flex';
            renderTasks();
        }

        function renderTasks() {
            const grid = document.getElementById('examplesGrid');
            grid.innerHTML = '';
            
            tasks.forEach((task, tIdx) => {
                const row = document.createElement('div');
                row.className = 'task-row';
                const mathBlock = document.createElement('div');
                mathBlock.className = 'math-block';

                task.expression.forEach(token => {
                    if (token.sym) {
                        const wrapper = document.createElement('div');
                        wrapper.className = 'symbol-wrapper';
                        
                        if (token.step !== null) {
                            const input = document.createElement('input');
                            input.type = 'text';
                            input.inputMode = 'numeric';
                            input.className = 'intermediate-input';
                            input.value = task.userSteps[token.step] || '';
                            
                            input.addEventListener('input', (e) => handleInput(e, 'step', tIdx, token.step));
                            input.addEventListener('focus', (e) => activeInput = e.target);
                            wrapper.appendChild(input);
                        } else {
                            const spacer = document.createElement('div');
                            spacer.className = 'intermediate-spacer';
                            wrapper.appendChild(spacer);
                        }
                        
                        const symText = document.createElement('span');
                        symText.className = 'symbol-text';
                        symText.textContent = token.sym;
                        wrapper.appendChild(symText);
                        mathBlock.appendChild(wrapper);
                    } else {
                        const num = document.createElement('span');
                        num.className = 'number-text';
                        num.textContent = token.num;
                        mathBlock.appendChild(num);
                    }
                });

                const eq = document.createElement('span');
                eq.className = 'equals-sign';
                eq.textContent = '=';
                mathBlock.appendChild(eq);

                const finalInp = document.createElement('input');
                finalInp.type = 'text';
                finalInp.inputMode = 'numeric';
                finalInp.className = 'final-input';
                finalInp.value = task.userFinal || '';
                finalInp.addEventListener('input', (e) => handleInput(e, 'final', tIdx));
                finalInp.addEventListener('focus', (e) => activeInput = e.target);
                mathBlock.appendChild(finalInp);

                row.appendChild(mathBlock);
                grid.appendChild(row);
            });

            updateCheckBtn();
        }

        function handleInput(e, type, tIdx, stepIdx = null) {
            let val = e.target.value.replace(/[^0-9]/g, '');
            if (val !== e.target.value) e.target.value = val;

            if (type === 'final') {
                tasks[tIdx].userFinal = val;
            } else {
                tasks[tIdx].userSteps[stepIdx] = val;
            }
            
            saveState();
            updateCheckBtn();
            document.getElementById('statusBanner').textContent = '';
        }

        function updateCheckBtn() {
            const allFilled = tasks.every(t => t.userFinal.trim() !== '');
            document.getElementById('checkBtn').disabled = !allFilled;
        }

        function checkAnswers() {
            let correct = 0;
            tasks.forEach(task => {
                let isOk = true;
                if (parseInt(task.userFinal) !== task.finalAnswer) isOk = false;
                
                task.steps.forEach((ans, idx) => {
                    let uVal = task.userSteps[idx].trim();
                    if (uVal !== '' && parseInt(uVal) !== ans) isOk = false;
                });
                if (isOk) correct++;
            });

            const banner = document.getElementById('statusBanner');
            if (correct === tasks.length) {
                banner.className = 'status-banner status-success';
                banner.textContent = `Все ${tasks.length} примеров решены верно!`;
            } else {
                banner.className = 'status-banner status-error';
                banner.textContent = `Верно: ${correct} из ${tasks.length}. Ищи ошибки!`;
            }
        }

        function resetTraining() {
            if (confirm('Сбросить все примеры и начать заново?')) {
                tasks = [];
                localStorage.removeItem(LS_KEY);
                document.getElementById('trainerScreen').style.display = 'none';
                document.getElementById('bottomPanel').style.display = 'none';
                document.getElementById('setupScreen').style.display = 'flex';
                document.getElementById('statusBanner').textContent = '';
                activeInput = null;
            }
        }

        function saveState() { localStorage.setItem(LS_KEY, JSON.stringify(tasks)); }
        function loadState() {
            const saved = localStorage.getItem(LS_KEY);
            if (saved) { try { tasks = JSON.parse(saved); } catch(e) { tasks = []; } }
        }

        // --- Клавиатура ---
        function vkInput(num) {
            if (!activeInput || !document.body.contains(activeInput)) return;
            if (activeInput.value.length < 3) {
                activeInput.value += num;
                activeInput.dispatchEvent(new Event('input', { bubbles: true }));
            }
        }

        function vkDelete() {
            if (!activeInput || !document.body.contains(activeInput)) return;
            activeInput.value = activeInput.value.slice(0, -1);
            activeInput.dispatchEvent(new Event('input', { bubbles: true }));
        }

        function vkClear() {
            if (!activeInput || !document.body.contains(activeInput)) return;
            activeInput.value = '';
            activeInput.dispatchEvent(new Event('input', { bubbles: true }));
        }

        document.getElementById('virtualKeyboard').addEventListener('mousedown', e => e.preventDefault());
        document.getElementById('virtualKeyboard').addEventListener('touchstart', e => e.preventDefault(), {passive: false});
    </script>
</body>
</html>
